services:
  sandbox-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${SANDBOX_API_IMAGE:-sandbox-api:latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${SANDBOX_WORKSPACE_BACKEND_PRESET}" in
          minio)
            export SANDBOX_STORAGE_FILESYSTEM_PROVIDER=minio
            export SANDBOX_WORKSPACE_BACKEND_PROFILE=minio-sigv4-path-style-v1
            ;;
          huawei-obs-public)
            export SANDBOX_STORAGE_FILESYSTEM_PROVIDER=obs
            export SANDBOX_WORKSPACE_BACKEND_PROFILE=huawei-obs-public-v1
            ;;
          huawei-obs-private)
            export SANDBOX_STORAGE_FILESYSTEM_PROVIDER=obs
            export SANDBOX_WORKSPACE_BACKEND_PROFILE=huawei-obs-private-2023-v1
            ;;
          *)
            echo "unsupported STORAGE_PRESET: $${SANDBOX_WORKSPACE_BACKEND_PRESET}" >&2
            exit 2
            ;;
        esac
        exec /app/sandbox --config /etc/sandbox/config.yaml
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_RUNTIME_TYPE=docker
      - SANDBOX_RUNTIME_DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_STORAGE_STATE_REDIS_ADDR=redis:6379
      - SANDBOX_STORAGE_STATE_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SANDBOX_STORAGE_STATE_REDIS_DB=${REDIS_DB:-0}
      - SANDBOX_STORAGE_FILESYSTEM_BUCKET=${STORAGE_BUCKET:-}
      - SANDBOX_STORAGE_FILESYSTEM_REGION=${STORAGE_REGION:-}
      - SANDBOX_STORAGE_FILESYSTEM_ENDPOINT=${STORAGE_ENDPOINT:-}
      - SANDBOX_STORAGE_FILESYSTEM_SUB_PATH=${STORAGE_SUB_PATH:-}
      - SANDBOX_STORAGE_FILESYSTEM_USE_SSL=${STORAGE_USE_SSL:-true}
      - SANDBOX_STORAGE_FILESYSTEM_ACCESS_KEY=${STORAGE_ACCESS_KEY:-}
      - SANDBOX_STORAGE_FILESYSTEM_SECRET_KEY=${STORAGE_SECRET_KEY:-}
      - SANDBOX_WORKSPACE_DEFAULT_MOUNT_MODE=${WORKSPACE_DEFAULT_MOUNT_MODE:-sync}
      - SANDBOX_WORKSPACE_ENABLED_MOUNT_MODES=${WORKSPACE_ENABLED_MOUNT_MODES:-sync}
      - SANDBOX_WORKSPACE_CACHE_SIZE=${WORKSPACE_CACHE_SIZE:-2Gi}
      - SANDBOX_WORKSPACE_CACHE_MEDIUM=disk
      - SANDBOX_WORKSPACE_MOUNT_TIMEOUT_SECONDS=${WORKSPACE_MOUNT_TIMEOUT_SECONDS:-30}
      - SANDBOX_WORKSPACE_FLUSH_TIMEOUT_SECONDS=${WORKSPACE_FLUSH_TIMEOUT_SECONDS:-30}
      - SANDBOX_WORKSPACE_UNMOUNT_TIMEOUT_SECONDS=${WORKSPACE_UNMOUNT_TIMEOUT_SECONDS:-15}
      - SANDBOX_WORKSPACE_RECREATE_MAX_ATTEMPTS=1
      - SANDBOX_WORKSPACE_LEASE_TTL_SECONDS=${WORKSPACE_LEASE_TTL_SECONDS:-120}
      - SANDBOX_WORKSPACE_LEASE_RENEW_INTERVAL_SECONDS=${WORKSPACE_LEASE_RENEW_INTERVAL_SECONDS:-30}
      - SANDBOX_WORKSPACE_QUOTA_MODE=soft
      - SANDBOX_WORKSPACE_FUSE_POOL_MIN_SIZE=${FUSE_POOL_MIN_SIZE:-1}
      - SANDBOX_WORKSPACE_FUSE_POOL_MAX_SIZE=${FUSE_POOL_MAX_SIZE:-3}
      - SANDBOX_WORKSPACE_FUSE_POOL_REFILL_INTERVAL_SECONDS=${FUSE_POOL_REFILL_INTERVAL_SECONDS:-10}
      - SANDBOX_WORKSPACE_FUSE_POOL_PREPARE_TIMEOUT_SECONDS=${FUSE_POOL_PREPARE_TIMEOUT_SECONDS:-120}
      - SANDBOX_WORKSPACE_BACKEND_PRESET=${STORAGE_PRESET:-minio}
      - SANDBOX_WORKSPACE_BACKEND_DRIVER=s3fs
      - SANDBOX_WORKSPACE_BACKEND_STORAGE_IDENTITY=${STORAGE_IDENTITY:-local-minio}
      - SANDBOX_WORKSPACE_BACKEND_MOUNTER_IMAGE=${FUSE_MOUNTER_IMAGE:-}
      - SANDBOX_WORKSPACE_BACKEND_DOCKER_IMAGE=${FUSE_SANDBOX_IMAGE:-}
      - SANDBOX_WORKSPACE_BACKEND_CREDENTIAL_GENERATION=${WORKSPACE_CREDENTIAL_GENERATION:-local-v1}
      - SANDBOX_WORKSPACE_BACKEND_LSM_PROFILE=${FUSE_LSM_PROFILE:-sandbox-fuse}
      - SANDBOX_SECURITY_API_KEY=${SECURITY_API_KEY:-***REDACTED_API_KEY***}
      - SANDBOX_SECURITY_SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-3600}
      - SANDBOX_POOL_MIN_SIZE=${POOL_MIN_SIZE:-3}
      - SANDBOX_POOL_MAX_SIZE=${POOL_MAX_SIZE:-20}
      - SANDBOX_IMAGES_SANDBOX=${SANDBOX_IMAGE:-sandbox:latest}
      - SANDBOX_IMAGES_GATEWAY=${GATEWAY_IMAGE:-sandbox-gateway:latest}
      - SANDBOX_TELEMETRY_TRACER_OTLP_ENABLED=${TELEMETRY_TRACER_ENABLED:-false}
      - SANDBOX_TELEMETRY_TRACER_OTLP_ENDPOINT=${TELEMETRY_TRACER_ENDPOINT:-}
      - SANDBOX_TELEMETRY_METRICS_OTLP_ENABLED=${TELEMETRY_METRICS_ENABLED:-false}
      - SANDBOX_TELEMETRY_METRICS_OTLP_ENDPOINT=${TELEMETRY_METRICS_ENDPOINT:-}
      - SANDBOX_TELEMETRY_LOG_OTLP_ENABLED=${TELEMETRY_LOG_ENABLED:-false}
      - SANDBOX_TELEMETRY_LOG_OTLP_ENDPOINT=${TELEMETRY_LOG_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      sandbox-images:
        condition: service_completed_successfully

  # Build all sandbox images before starting the API server
  sandbox-images:
    image: docker:cli
    restart: "no"
    environment:
      # Use a standalone config because host credential helpers are not
      # available inside docker:cli. Override DOCKER_AUTH_CONFIG_FILE for an
      # authenticated private registry; never pass registry auth via env.
      - DOCKER_CONFIG=/root/.docker
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-}
      - GATEWAY_IMAGE=${GATEWAY_IMAGE:-}
      - FUSE_MOUNTER_IMAGE=${FUSE_MOUNTER_IMAGE:-}
      - FUSE_SANDBOX_IMAGE=${FUSE_SANDBOX_IMAGE:-}
      - WORKSPACE_ENABLED_MOUNT_MODES=${WORKSPACE_ENABLED_MOUNT_MODES:-sync}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount only config.json read-only, leaving the parent writable for
      # buildx's non-secret local state when default images are built.
      - ${DOCKER_AUTH_CONFIG_FILE:-./docker-auth-public/config.json}:/root/.docker/config.json:ro
      # The ordinary sandbox now compiles workspace-probe from repository
      # source in a controlled build stage, so its build context is repo root.
      - ../:/repo:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ -n "$${SANDBOX_IMAGE}" ]; then
          docker image inspect "$${SANDBOX_IMAGE}" >/dev/null 2>&1 || docker pull "$${SANDBOX_IMAGE}"
        else
          docker build -f /repo/docker/images/sandbox/Dockerfile -t sandbox:latest /repo
        fi
        if [ -n "$${GATEWAY_IMAGE}" ]; then
          docker image inspect "$${GATEWAY_IMAGE}" >/dev/null 2>&1 || docker pull "$${GATEWAY_IMAGE}"
        else
          docker build -t sandbox-gateway:latest /repo/docker/images/gateway
        fi
        case ",$${WORKSPACE_ENABLED_MOUNT_MODES}," in
          *,fuse,*)
            for image in "$${FUSE_MOUNTER_IMAGE}" "$${FUSE_SANDBOX_IMAGE}"; do
              test -n "$${image}" || { echo "FUSE images are required when fuse mode is enabled" >&2; exit 2; }
              docker image inspect "$${image}" >/dev/null 2>&1 || docker pull "$${image}"
            done
            ;;
        esac
        echo "All sandbox images built successfully"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  redis-data:
