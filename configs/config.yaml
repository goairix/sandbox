# =============================================================================
# Sandbox Service Configuration
# =============================================================================
# All values below are the defaults. Override by editing this file, or by
# setting environment variables prefixed with SANDBOX_, e.g.:
#   SANDBOX_SERVER_PORT=9090
#   SANDBOX_STORAGE_STATE_REDIS_ADDR=redis:6379
# Nested keys use underscores as separators in env var names, e.g.:
#   SANDBOX_STORAGE_FILESYSTEM_ACCESS_KEY=my-key
# =============================================================================

# -----------------------------------------------------------------------------
# Server — HTTP API server settings
# -----------------------------------------------------------------------------
server:
  # TCP port the HTTP server listens on.
  port: 8080
  # Network interface to bind. Use 0.0.0.0 to listen on all interfaces.
  host: "0.0.0.0"

# -----------------------------------------------------------------------------
# Images — sandbox container images
# -----------------------------------------------------------------------------
images:
  python: "sandbox-python:latest"
  nodejs: "sandbox-nodejs:latest"
  bash: "sandbox-bash:latest"
  gateway: "sandbox-gateway:latest"

# -----------------------------------------------------------------------------
# Runtime — sandbox execution backend
# -----------------------------------------------------------------------------
runtime:
  # Backend type. Supported values: "docker", "kubernetes"
  type: "docker"

  # Docker-specific settings (used when type = "docker")
  docker:
    # Docker daemon socket or TCP address.
    # Leave empty to use the default socket (/var/run/docker.sock on Linux).
    host: ""
    # Root-only staging directory visible at this identical absolute path to
    # both sandbox-api and the Docker daemon when workspace.mode is "fuse".
    workspace_secret_root: "/var/lib/sandbox/workspace-secrets"

  # Kubernetes-specific settings (used when type = "kubernetes")
  kubernetes:
    # Path to the kubeconfig file.
    # Leave empty to use the in-cluster service account credentials.
    kubeconfig: ""
    # Kubernetes namespace where sandbox pods are created.
    namespace: ""

# -----------------------------------------------------------------------------
# Pool — pre-warmed sandbox pool settings
# -----------------------------------------------------------------------------
pool:
  # Minimum number of idle sandboxes to keep ready.
  min_size: 3
  # Maximum number of sandboxes in the pool.
  max_size: 20
  # How often (in seconds) to refill the pool back to min_size.
  refill_interval_seconds: 10

# -----------------------------------------------------------------------------
# Storage — state and object storage backends
# -----------------------------------------------------------------------------
storage:
  # State storage (sandbox lifecycle tracking)
  state:
    redis:
      # Redis server address in host:port format.
      addr: "localhost:6379"
      # Redis authentication password. Leave empty for no authentication.
      password: ""
      # Redis database index (0–15).
      db: 0

  # Filesystem storage (workspace persistent storage)
  filesystem:
    # Storage provider. Supported values: "local", "s3", "cos", "oss", "obs", "minio"
    provider: "local"
    # Bucket name (not used for the "local" provider).
    bucket: ""
    # Storage region (provider-dependent).
    region: ""
    # Custom endpoint URL (optional, for private / compatible storage).
    # For COS, this is the full bucket URL (e.g. "https://bucket-xxx.cos.ap-guangzhou.myqcloud.com").
    endpoint: ""
    # Access key ID.
    access_key: ""
    # Secret access key.
    secret_key: ""
    # Temporary/session credentials are explicit so FUSE mode can reject them.
    # FUSE v1 supports long-lived AK/SK credentials only.
    session_token: ""
    credential_expiry: ""
    # Read-only Secret file paths used by the FUSE control plane. These must
    # remain empty in sync mode unless the storage client is configured to use them.
    credential_files:
      access_key_file: ""
      secret_key_file: ""
      session_token_file: ""
      credential_expiry_file: ""
    # Optional private CA bundle used by the control-plane object client.
    ca_file: ""
    # Local directory for the "local" provider.
    local_path: "/tmp/sandbox-storage"
    # Sub-path prefix within the bucket / root directory (optional).
    sub_path: ""
    # Use SSL for MinIO connections (only used when provider = "minio").
    use_ssl: false

# -----------------------------------------------------------------------------
# Workspace — workspace sync strategy
# -----------------------------------------------------------------------------
workspace:
  # Workspace implementation. Keep "sync" for the existing copy-in/copy-out
  # behavior. "fuse" requires every fail-closed setting in the template below.
  mode: "sync"
  # Local Docker + private/loopback MinIO validation only. Production must
  # leave this false until the selected profile has verified durable flush.
  allow_unverified_durable_flush: false
  # Automatic sync interval in seconds. When > 0, a background goroutine
  # periodically syncs changed files from containers back to storage,
  # reducing data loss if a container crashes between manual syncs.
  # Set to 0 to disable. Recommended: 30 for long-running agent sessions.
  auto_sync_interval_seconds: 0

  # FUSE defaults. They are inert while mode = "sync"; switching to "fuse"
  # additionally requires storage credentials and a selected provider profile.
  secret_name: ""
  cache_size: "2Gi"
  cache_medium: "disk"
  mount_timeout_seconds: 30
  flush_timeout_seconds: 30
  unmount_timeout_seconds: 15
  recreate_max_attempts: 1
  lease_ttl_seconds: 120
  lease_renew_interval_seconds: 30
  quota_mode: "soft"

  mounter_resources:
    cpu_request: "50m"
    cpu_limit: "1"
    memory_request: "64Mi"
    memory_limit: "512Mi"
    ephemeral_storage_request: "512Mi"
    ephemeral_storage_limit: "3Gi"

  fuse_pool:
    min_size: 3
    max_size: 20
    refill_interval_seconds: 10
    prepare_timeout_seconds: 120

  # Provider profiles are deliberately not active by default. Copy only the
  # selected storage.filesystem.provider entry, replace all operational
  # placeholders, and keep both images pinned to immutable sha256 digests.
  providers: {}
  # providers:
  #   minio:
  #     driver: "s3fs"
  #     profile: "approved-minio-profile"
  #     storage_identity: "stable-physical-storage-id"
  #     mounter_image: "registry.example.com/mounter@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  #     docker_image: "registry.example.com/sandbox-fuse@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  #     ca_secret_key: "ca.crt"
  #     credential_generation: "rotation-generation"
  #     endpoint_host_ips:
  #       - "192.0.2.10"
  #     lsm_profile: "sandbox-fuse"
  #     system_egress_mode: "cidr" # "cidr" or "cilium-fqdn"
  #     dns_cidrs:
  #       - "10.96.0.10/32"
  #     system_egress_fqdns:
  #       - "minio.example.com"
  #     system_egress_cidrs:
  #       - "192.0.2.10/32"
  #     endpoint_ports:
  #       - 9000
  #     proxy_url: "" # Proxies are forbidden in FUSE mode.

# -----------------------------------------------------------------------------
# Security — sandbox isolation and resource limits
# -----------------------------------------------------------------------------
security:
  # API key for authentication. Empty string disables auth.
  api_key: ""
  # Rate limit (requests per second per client IP). 0 = disabled.
  rate_limit: 0
  # Maximum wall-clock time (seconds) allowed for a single execution.
  exec_timeout_seconds: 30
  # Maximum permitted value for an execution timeout in seconds.
  max_exec_timeout_seconds: 600
  # Maximum sandbox lifetime in seconds (0 = no limit). Default: 3600 (1 hour).
  sandbox_timeout_seconds: 3600
  # Disk quota per sandbox (e.g. "100Mi", "1Gi").
  max_disk: "100Mi"
  # /tmp quota per sandbox (e.g. "50Mi", "1Gi").
  max_tmp_disk: "50Mi"
  # Maximum number of processes / threads per sandbox.
  max_pids: 100
  # CPU limit per sandbox (e.g. "1", "0.5"). Prevents CPU-intensive abuse such as
  # cryptocurrency mining. Empty string disables the limit.
  max_cpu: "500m"
  max_cpu_request: "100m"
  # Memory limit per sandbox (e.g. "256Mi", "1Gi").
  max_memory: "512Mi"
  max_memory_request: "128Mi"
  # Maximum body size for the direct file-upload route (2 GiB by default).
  max_upload_bytes: 2147483648
  # Whether outbound network access is allowed inside the sandbox.
  network_enabled: false
  # CIDR ranges the sandbox is allowed to reach when network_enabled = true.
  # network_whitelist:
  #   - "10.0.0.0/8"
  #   - "192.168.0.0/16"
  network_whitelist: []
  # Path to a custom seccomp profile JSON file.
  # Leave empty to use the container runtime default profile.
  seccomp_profile: ""

# 监控配置
telemetry:
  service_name: "sandbox"
  service_version: "v1.0.0"
  tracer: # 链路追踪
    otlp_enabled: false # 是否开启数据上报
    otlp_endpoint: "http://127.0.0.1:4318" # 上报地址
  metrics: # 监控
    otlp_enabled: false # 是否开启数据上报
    otlp_endpoint: "http://127.0.0.1:4318" # 上报地址
  log: # 日志
    otlp_enabled: false # 是否开启数据上报
    otlp_endpoint: "http://127.0.0.1:4318" # 上报地址
