# Fresh installation only. Supply a reachable etcd cluster and an empty
# dedicated prefix. Authentication is optional. Set existingSecret to a
# Secret with ca.crt, client.crt and client.key when the cluster uses mTLS.
redis:
  enabled: false

config:
  pool:
    # Keep three prepared ordinary shells for requests without FUSE.
    minSize: 3
    maxSize: 20
  workspace:
    # New etcd installations use FUSE for requests with a workspace path.
    # Keep sync selectable explicitly while its compatibility path remains.
    defaultMountMode: fuse
    enabledMountModes:
      - fuse
      - sync
    # Keep three prepared FUSE shells for the 20-sandbox gray rollout. The
    # ownership guard still scans resident owners; this is not a large-N
    # prewarming or capacity setting.
    # maxSize bounds preparing and prepared shells only. It is not a limit
    # on live FUSE sandboxes; larger live populations need separate testing.
    fusePool:
      minSize: 3
      maxSize: 20
  storage:
    state:
      backend: etcd
      etcd:
        endpoints:
          - etcd.example.internal:2379
        prefix: /sandbox/new-cell/
        timeoutMs: 3000
        existingSecret: ""
