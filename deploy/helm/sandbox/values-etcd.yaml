# Fresh installation only. Supply a reachable etcd cluster and an empty
# dedicated prefix. Authentication is optional. Set existingSecret to a
# Secret with ca.crt, client.crt and client.key when the cluster uses mTLS.
redis:
  enabled: false

config:
  storage:
    state:
      backend: etcd
      etcd:
        endpoints:
          - etcd.example.internal:2379
        prefix: /sandbox/new-cell/
        timeoutMs: 3000
        existingSecret: ""
