replicaCount: 2

image:
  repository: sandbox
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Redis configuration
redis:
  # Use the built-in Redis deployment (set to false to use an external Redis)
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  password: ""
  # External Redis (used when redis.enabled is false)
  external:
    addr: ""
    password: ""
    db: 0

config:
  server:
    port: 8080
  runtime:
    type: kubernetes
    kubernetes:
      # Namespace for sandbox pods. Defaults to the Helm release namespace if empty.
      namespace: ""
  pool:
    minSize: 3
    maxSize: 20
  images:
    sandbox: "sandbox:latest"
    gateway: "sandbox-gateway:latest"
  storage:
    filesystem:
      provider: s3
      bucket: sandbox-storage
      region: us-east-1
      endpoint: ""
      accessKey: ""
      secretKey: ""
      credentialFiles:
        accessKeyFile: "/run/secrets/workspace/accessKey"
        secretKeyFile: "/run/secrets/workspace/secretKey"
      caFile: ""
      subPath: ""
      useSSL: false
  workspace:
    mode: sync
    autoSyncIntervalSeconds: 0
    secretName: ""
    cacheSize: 2Gi
    cacheMedium: disk
    mountTimeoutSeconds: 30
    flushTimeoutSeconds: 30
    unmountTimeoutSeconds: 15
    recreateMaxAttempts: 1
    leaseTTLSeconds: 120
    leaseRenewIntervalSeconds: 30
    quotaMode: soft
    mounterResources:
      cpuRequest: 50m
      cpuLimit: "1"
      memoryRequest: 64Mi
      memoryLimit: 512Mi
      ephemeralStorageRequest: 512Mi
      ephemeralStorageLimit: 3Gi
    fusePool:
      minSize: 3
      maxSize: 20
      refillIntervalSeconds: 10
      prepareTimeoutSeconds: 120
    providers: {}
  security:
    apiKey: ""
    rateLimit: 100
    execTimeoutSeconds: 30
    sandboxTimeoutSeconds: 3600
    maxMemory: "512Mi"
    maxMemoryRequest: "128Mi"
    maxDisk: "100Mi"
    maxTmpDisk: "50Mi"
    maxPids: 100
    maxCpu: "500m"
    maxCpuRequest: "100m"
    maxUploadBytes: "2147483648"
    seccompProfile: RuntimeDefault
    networkEnabled: false
    networkBlockPrivate: false
  telemetry:
    serviceName: "sandbox"
    serviceVersion: "v1.0.0"
    tracer:
      otlpEnabled: false
      otlpEndpoint: ""
    metrics:
      otlpEnabled: false
      otlpEndpoint: ""
    log:
      otlpEnabled: false
      otlpEndpoint: ""

networkPolicy:
  enabled: true

# In FUSE mode this Secret must exist in the control namespace. A Secret with
# config.workspace.secretName and the same keys must separately exist in the
# runtime namespace for dynamically-created Pods.
workspaceCredentials:
  apiSecretName: ""
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  caKey: ca.crt
  # Required only when sandbox-api runs in Kubernetes but controls a Docker
  # daemon. It must be the same root-owned absolute path on the Docker host.
  dockerStagingHostPath: ""
