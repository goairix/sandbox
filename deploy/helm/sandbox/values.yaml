replicaCount: 2

# 按需开启生产安全校验，生产配置示例见 values-production.yaml。
productionSafetyChecks: false

# 优雅终止等待时间必须大于 HTTP 排空超时与滚动更新期间
# 分布式操作、控制器租约交接窗口之和。
terminationGracePeriodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: registry.i.huaxisy.com/library/ai-infra/sandbox-api
  tag: v0.2.12
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# sandbox-api 在启动 HTTP 监听前初始化并协调运行时池。
# 该有界初始化阶段应由启动探针屏蔽存活探针检查。
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 120

# Helm 删除 Redis 前，先将 API Deployment 缩容至零，完成所有
# 持久和临时工作区的清理，排空普通池、FUSE 池，并审计确认无遗留状态。
preDeleteDrain:
  enabled: true
  timeoutSeconds: 600

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Redis 配置
redis:
  # 使用 Chart 内置 Redis；设为 false 时使用外部 Redis。
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  password: ""
  # 外部 Redis 配置，仅在 redis.enabled=false 时生效。
  external:
    mode: standalone
    addr: ""
    addrs: []
    masterName: ""
    username: ""
    password: ""
    db: 0
    # native 要求后端提供同步提交保证；普通 Redis 的异步复制
    # 应使用 replica_ack 进行副本确认。
    durability: best_effort
    requireHA: false
    ackReplicas: 1
    ackTimeoutMs: 100
    poolSize: 0
    minIdleConns: 2
    dialTimeoutMs: 5000
    readTimeoutMs: 3000
    writeTimeoutMs: 3000
    maxRetries: 2

config:
  server:
    port: 8080
  runtime:
    type: kubernetes
    kubernetes:
      # 沙盒 Pod 所在命名空间，留空时使用 Helm release 的命名空间。
      namespace: ""
      # 可选的完整 Pod/Service 分配网段，须覆盖当前及未来分配范围。
      # 两项同时配置时不扫描分配资源；同时留空时进行有界自动发现。
      podCIDRs: []
      serviceCIDRs: []
  pool:
    minSize: 3
    maxSize: 20
  images:
    sandbox: "registry.i.huaxisy.com/library/ai-infra/sandbox-runtime:v0.2.12"
    gateway: "registry.i.huaxisy.com/library/ai-infra/sandbox-gateway:v0.2.12"
  storage:
    filesystem:
      # 整个 release 只选择一个后端预设，预设固定存储提供商及协议配置，
      # API 请求不能覆盖该选择。
      preset: minio
      bucket: sandbox-storage
      # 可选。MinIO 默认为 us-east-1；华为 OBS 标准端点可自动推导区域。
      region: ""
      endpoint: minio.example.com
      # AK/SK 由 sandbox-api 直接读取，仅通过私有、一次性的
      # authorize 标准输入通道传给挂载器。
      accessKey: ""
      secretKey: ""
      storageIdentity: production-object-store
      credentialGeneration: rotation-1
      subPath: ""
      useSSL: true
  workspace:
    defaultMountMode: sync
    enabledMountModes:
      - sync
      - fuse
    fuseImages:
      mounter: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-mounter:v0.2.12
      docker: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-docker:v0.2.12
    # 仅用于 Docker Desktop 上的本地 kind 集群。生产环境必须保持 false，
    # 并配置真实的 AppArmor/SELinux 安全策略。
    allowMissingLSMForKind: false
    autoSyncIntervalSeconds: 0
    cacheSize: 2Gi
    cacheMedium: disk
    mountTimeoutSeconds: 30
    flushTimeoutSeconds: 30
    unmountTimeoutSeconds: 15
    recreateMaxAttempts: 1
    leaseTTLSeconds: 120
    leaseRenewIntervalSeconds: 30
    quotaMode: soft
    mounterResources:
      cpuRequest: 50m
      cpuLimit: "1"
      memoryRequest: 64Mi
      memoryLimit: 512Mi
      ephemeralStorageRequest: 512Mi
      ephemeralStorageLimit: 3Gi
    fusePool:
      minSize: 3
      maxSize: 20
      refillIntervalSeconds: 10
      prepareTimeoutSeconds: 120
    lsmProfile: sandbox-fuse
  security:
    # 实际部署优先使用 apiKeySecretName，避免在 Helm 升级命令行或
    # values 文件中直接填写 API 密钥。引用的 Secret 必须包含 api-key 键。
    apiKeySecretName: ""
    apiKey: ""
    rateLimit: 100
    execTimeoutSeconds: 30
    sandboxTimeoutSeconds: 3600
    maxMemory: "512Mi"
    maxMemoryRequest: "128Mi"
    maxDisk: "100Mi"
    maxTmpDisk: "50Mi"
    maxPids: 100
    maxCpu: "500m"
    maxCpuRequest: "100m"
    maxUploadBytes: "2147483648"
    seccompProfile: RuntimeDefault
    networkEnabled: false
    networkBlockPrivate: false
  telemetry:
    serviceName: "sandbox"
    serviceVersion: "v1.0.0"
    tracer:
      otlpEnabled: false
      otlpEndpoint: ""
    metrics:
      otlpEnabled: false
      otlpEndpoint: ""
    log:
      otlpEnabled: false
      otlpEndpoint: ""

networkPolicy:
  enabled: true
