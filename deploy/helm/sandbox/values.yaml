replicaCount: 2

# Must exceed the HTTP drain timeout plus the distributed operation/controller
# lease handoff window during rolling updates.
terminationGracePeriodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: registry.i.huaxisy.com/library/ai-infra/sandbox-api
  tag: v0.2.12
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# sandbox-api initializes and reconciles its runtime pools before opening the
# HTTP listener. Keep liveness disabled during that bounded initialization.
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 120

# Before Helm deletes Redis, scale the API Deployment to zero, finalize all
# persistent and ephemeral workspaces, drain both pools, and audit zero state.
preDeleteDrain:
  enabled: true
  timeoutSeconds: 600

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Redis configuration
redis:
  # Use the built-in Redis deployment (set to false to use an external Redis)
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  password: ""
  # External Redis (used when redis.enabled is false)
  external:
    mode: standalone
    addr: ""
    addrs: []
    masterName: ""
    username: ""
    password: ""
    db: 0
    # native requires a provider with synchronous commit semantics. Use
    # replica_ack for ordinary asynchronous Redis replication.
    durability: best_effort
    requireHA: false
    ackReplicas: 1
    ackTimeoutMs: 100
    poolSize: 0
    minIdleConns: 2
    dialTimeoutMs: 5000
    readTimeoutMs: 3000
    writeTimeoutMs: 3000
    maxRetries: 2

config:
  server:
    port: 8080
  runtime:
    type: kubernetes
    kubernetes:
      # Namespace for sandbox pods. Defaults to the Helm release namespace if empty.
      namespace: ""
  pool:
    minSize: 3
    maxSize: 20
  images:
    sandbox: "registry.i.huaxisy.com/library/ai-infra/sandbox-runtime:v0.2.12"
    gateway: "registry.i.huaxisy.com/library/ai-infra/sandbox-gateway:v0.2.12"
  storage:
    filesystem:
      # Exactly one release-wide backend preset is selected. The preset fixes
      # the provider/profile pair; API requests cannot override it.
      preset: minio
      bucket: sandbox-storage
      # Optional. MinIO defaults to us-east-1; standard Huawei OBS endpoints derive it.
      region: ""
      endpoint: minio.example.com
      # AK/SK are read directly by sandbox-api. They are delivered to the
      # mounter only through the private one-shot authorize stdin channel.
      accessKey: ""
      secretKey: ""
      storageIdentity: production-object-store
      credentialGeneration: rotation-1
      subPath: ""
      useSSL: true
  workspace:
    defaultMountMode: sync
    enabledMountModes:
      - sync
      - fuse
    fuseImages:
      mounter: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-mounter:v0.2.12
      docker: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-docker:v0.2.12
    # Local kind on Docker Desktop only. Production must keep this false and
    # configure a real AppArmor/SELinux profile.
    allowMissingLSMForKind: false
    autoSyncIntervalSeconds: 0
    cacheSize: 2Gi
    cacheMedium: disk
    mountTimeoutSeconds: 30
    flushTimeoutSeconds: 30
    unmountTimeoutSeconds: 15
    recreateMaxAttempts: 1
    leaseTTLSeconds: 120
    leaseRenewIntervalSeconds: 30
    quotaMode: soft
    mounterResources:
      cpuRequest: 50m
      cpuLimit: "1"
      memoryRequest: 64Mi
      memoryLimit: 512Mi
      ephemeralStorageRequest: 512Mi
      ephemeralStorageLimit: 3Gi
    fusePool:
      minSize: 3
      maxSize: 20
      refillIntervalSeconds: 10
      prepareTimeoutSeconds: 120
    lsmProfile: sandbox-fuse
  security:
    # Prefer apiKeySecretName in real deployments so Helm upgrades do not need
    # the API key on the command line or in a values file. The referenced
    # Secret must contain the key `api-key`.
    apiKeySecretName: ""
    apiKey: ""
    rateLimit: 100
    execTimeoutSeconds: 30
    sandboxTimeoutSeconds: 3600
    maxMemory: "512Mi"
    maxMemoryRequest: "128Mi"
    maxDisk: "100Mi"
    maxTmpDisk: "50Mi"
    maxPids: 100
    maxCpu: "500m"
    maxCpuRequest: "100m"
    maxUploadBytes: "2147483648"
    seccompProfile: RuntimeDefault
    networkEnabled: false
    networkBlockPrivate: false
  telemetry:
    serviceName: "sandbox"
    serviceVersion: "v1.0.0"
    tracer:
      otlpEnabled: false
      otlpEndpoint: ""
    metrics:
      otlpEnabled: false
      otlpEndpoint: ""
    log:
      otlpEnabled: false
      otlpEndpoint: ""

networkPolicy:
  enabled: true
