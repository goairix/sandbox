{{- $sandboxNs := .Values.config.runtime.kubernetes.namespace | default .Release.Namespace }}
{{- $redisAddr := ternary (printf "%s-redis:6379" .Release.Name) .Values.redis.external.addr .Values.redis.enabled }}
{{- $redisPassword := ternary .Values.redis.password .Values.redis.external.password .Values.redis.enabled }}
{{- $redisDB := ternary 0 (.Values.redis.external.db | int) .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox
    release: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: sandbox
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: sandbox
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      containers:
        - name: sandbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          env:
            - name: SANDBOX_SERVER_PORT
              value: "{{ .Values.config.server.port }}"
            - name: SANDBOX_RUNTIME_TYPE
              value: "{{ .Values.config.runtime.type }}"
            - name: SANDBOX_RUNTIME_KUBERNETES_NAMESPACE
              value: "{{ $sandboxNs }}"
            - name: SANDBOX_POOL_MIN_SIZE
              value: "{{ .Values.config.pool.minSize }}"
            - name: SANDBOX_POOL_MAX_SIZE
              value: "{{ .Values.config.pool.maxSize }}"
            - name: SANDBOX_IMAGES_SANDBOX
              value: "{{ .Values.config.images.sandbox }}"
            - name: SANDBOX_IMAGES_GATEWAY
              value: "{{ .Values.config.images.gateway }}"
            - name: SANDBOX_STORAGE_STATE_REDIS_ADDR
              value: "{{ $redisAddr }}"
            {{- if $redisPassword }}
            - name: SANDBOX_STORAGE_STATE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ternary (printf "%s-redis" .Release.Name) (printf "%s-sandbox" .Release.Name) .Values.redis.enabled }}
                  key: password
            {{- end }}
            - name: SANDBOX_STORAGE_STATE_REDIS_DB
              value: "{{ $redisDB }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_PROVIDER
              value: "{{ .Values.config.storage.filesystem.provider }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_BUCKET
              value: "{{ .Values.config.storage.filesystem.bucket }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_REGION
              value: "{{ .Values.config.storage.filesystem.region }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_ENDPOINT
              value: "{{ .Values.config.storage.filesystem.endpoint }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_ACCESS_KEY
              value: "{{ .Values.config.storage.filesystem.accessKey }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_SECRET_KEY
              value: "{{ .Values.config.storage.filesystem.secretKey }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_SUB_PATH
              value: "{{ .Values.config.storage.filesystem.subPath }}"
            - name: SANDBOX_STORAGE_FILESYSTEM_USE_SSL
              value: "{{ .Values.config.storage.filesystem.useSSL }}"
            - name: SANDBOX_WORKSPACE_MODE
              value: "{{ .Values.config.workspace.mode }}"
            - name: SANDBOX_WORKSPACE_AUTO_SYNC_INTERVAL_SECONDS
              value: "{{ .Values.config.workspace.autoSyncIntervalSeconds }}"
          {{- if eq .Values.config.workspace.mode "fuse" }}
            {{- $providerName := .Values.config.storage.filesystem.provider }}
            {{- $provider := index .Values.config.workspace.providers $providerName }}
            - name: SANDBOX_STORAGE_FILESYSTEM_CREDENTIAL_FILES_ACCESS_KEY_FILE
              value: "/run/secrets/workspace/accessKey"
            - name: SANDBOX_STORAGE_FILESYSTEM_CREDENTIAL_FILES_SECRET_KEY_FILE
              value: "/run/secrets/workspace/secretKey"
            - name: SANDBOX_STORAGE_FILESYSTEM_CA_FILE
              value: {{ ternary "/run/secrets/workspace/ca.crt" "" (ne ($provider.caSecretKey | default "") "") | quote }}
            - name: SANDBOX_WORKSPACE_SECRET_NAME
              value: {{ .Values.config.workspace.secretName | quote }}
            - name: SANDBOX_WORKSPACE_CACHE_SIZE
              value: {{ .Values.config.workspace.cacheSize | quote }}
            - name: SANDBOX_WORKSPACE_CACHE_MEDIUM
              value: {{ .Values.config.workspace.cacheMedium | quote }}
            - name: SANDBOX_WORKSPACE_MOUNT_TIMEOUT_SECONDS
              value: {{ .Values.config.workspace.mountTimeoutSeconds | quote }}
            - name: SANDBOX_WORKSPACE_FLUSH_TIMEOUT_SECONDS
              value: {{ .Values.config.workspace.flushTimeoutSeconds | quote }}
            - name: SANDBOX_WORKSPACE_UNMOUNT_TIMEOUT_SECONDS
              value: {{ .Values.config.workspace.unmountTimeoutSeconds | quote }}
            - name: SANDBOX_WORKSPACE_RECREATE_MAX_ATTEMPTS
              value: {{ .Values.config.workspace.recreateMaxAttempts | quote }}
            - name: SANDBOX_WORKSPACE_LEASE_TTL_SECONDS
              value: {{ .Values.config.workspace.leaseTTLSeconds | quote }}
            - name: SANDBOX_WORKSPACE_LEASE_RENEW_INTERVAL_SECONDS
              value: {{ .Values.config.workspace.leaseRenewIntervalSeconds | quote }}
            - name: SANDBOX_WORKSPACE_QUOTA_MODE
              value: {{ .Values.config.workspace.quotaMode | quote }}
            - name: SANDBOX_WORKSPACE_FUSE_POOL_MIN_SIZE
              value: {{ .Values.config.workspace.fusePool.minSize | quote }}
            - name: SANDBOX_WORKSPACE_FUSE_POOL_MAX_SIZE
              value: {{ .Values.config.workspace.fusePool.maxSize | quote }}
            - name: SANDBOX_WORKSPACE_FUSE_POOL_REFILL_INTERVAL_SECONDS
              value: {{ .Values.config.workspace.fusePool.refillIntervalSeconds | quote }}
            - name: SANDBOX_WORKSPACE_FUSE_POOL_PREPARE_TIMEOUT_SECONDS
              value: {{ .Values.config.workspace.fusePool.prepareTimeoutSeconds | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_CPU_REQUEST
              value: {{ .Values.config.workspace.mounterResources.cpuRequest | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_CPU_LIMIT
              value: {{ .Values.config.workspace.mounterResources.cpuLimit | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_MEMORY_REQUEST
              value: {{ .Values.config.workspace.mounterResources.memoryRequest | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_MEMORY_LIMIT
              value: {{ .Values.config.workspace.mounterResources.memoryLimit | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_EPHEMERAL_STORAGE_REQUEST
              value: {{ .Values.config.workspace.mounterResources.ephemeralStorageRequest | quote }}
            - name: SANDBOX_WORKSPACE_MOUNTER_RESOURCES_EPHEMERAL_STORAGE_LIMIT
              value: {{ .Values.config.workspace.mounterResources.ephemeralStorageLimit | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_DRIVER
              value: {{ $provider.driver | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_PROFILE
              value: {{ $provider.profile | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_STORAGE_IDENTITY
              value: {{ $provider.storageIdentity | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_MOUNTER_IMAGE
              value: {{ $provider.mounterImage | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_DOCKER_IMAGE
              value: {{ $provider.dockerImage | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_CA_SECRET_KEY
              value: {{ $provider.caSecretKey | default "" | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_CREDENTIAL_GENERATION
              value: {{ $provider.credentialGeneration | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_ENDPOINT_HOST_IPS
              value: {{ join "," ($provider.endpointHostIPs | default list) | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_LSM_PROFILE
              value: {{ $provider.lsmProfile | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_SYSTEM_EGRESS_MODE
              value: {{ $provider.systemEgressMode | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_DNS_CIDRS
              value: {{ join "," $provider.dnsCIDRs | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_SYSTEM_EGRESS_FQDNS
              value: {{ join "," ($provider.systemEgressFQDNs | default list) | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_SYSTEM_EGRESS_CIDRS
              value: {{ join "," ($provider.systemEgressCIDRs | default list) | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_ENDPOINT_PORTS
              value: {{ join "," $provider.endpointPorts | quote }}
            - name: SANDBOX_WORKSPACE_PROVIDERS_{{ $providerName | upper }}_PROXY_URL
              value: {{ $provider.proxyURL | default "" | quote }}
          {{- end }}
            - name: SANDBOX_SECURITY_EXEC_TIMEOUT_SECONDS
              value: "{{ .Values.config.security.execTimeoutSeconds }}"
            - name: SANDBOX_SECURITY_SANDBOX_TIMEOUT_SECONDS
              value: "{{ .Values.config.security.sandboxTimeoutSeconds }}"
            - name: SANDBOX_SECURITY_MAX_MEMORY
              value: "{{ .Values.config.security.maxMemory }}"
            - name: SANDBOX_SECURITY_MAX_MEMORY_REQUEST
              value: "{{ .Values.config.security.maxMemoryRequest }}"
            - name: SANDBOX_SECURITY_MAX_DISK
              value: "{{ .Values.config.security.maxDisk }}"
            - name: SANDBOX_SECURITY_MAX_TMP_DISK
              value: "{{ .Values.config.security.maxTmpDisk }}"
            - name: SANDBOX_SECURITY_MAX_PIDS
              value: "{{ .Values.config.security.maxPids }}"
            - name: SANDBOX_SECURITY_MAX_CPU
              value: "{{ .Values.config.security.maxCpu }}"
            - name: SANDBOX_SECURITY_MAX_CPU_REQUEST
              value: "{{ .Values.config.security.maxCpuRequest }}"
            - name: SANDBOX_SECURITY_MAX_UPLOAD_BYTES
              value: {{ .Values.config.security.maxUploadBytes | default 2147483648 | quote }}
            - name: SANDBOX_SECURITY_SECCOMP_PROFILE
              value: {{ .Values.config.security.seccompProfile | default "RuntimeDefault" | quote }}
            - name: SANDBOX_SECURITY_NETWORK_ENABLED
              value: "{{ .Values.config.security.networkEnabled }}"
            - name: SANDBOX_SECURITY_NETWORK_BLOCK_PRIVATE
              value: "{{ .Values.config.security.networkBlockPrivate }}"
          {{- if .Values.config.security.apiKey }}
            - name: SANDBOX_SECURITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api
                  key: api-key
          {{- end }}
            - name: SANDBOX_TELEMETRY_SERVICE_NAME
              value: "{{ .Values.config.telemetry.serviceName }}"
            - name: SANDBOX_TELEMETRY_SERVICE_VERSION
              value: "{{ .Values.config.telemetry.serviceVersion }}"
            - name: SANDBOX_TELEMETRY_TRACER_OTLP_ENABLED
              value: "{{ .Values.config.telemetry.tracer.otlpEnabled }}"
            {{- if .Values.config.telemetry.tracer.otlpEndpoint }}
            - name: SANDBOX_TELEMETRY_TRACER_OTLP_ENDPOINT
              value: "{{ .Values.config.telemetry.tracer.otlpEndpoint }}"
            {{- end }}
            - name: SANDBOX_TELEMETRY_METRICS_OTLP_ENABLED
              value: "{{ .Values.config.telemetry.metrics.otlpEnabled }}"
            {{- if .Values.config.telemetry.metrics.otlpEndpoint }}
            - name: SANDBOX_TELEMETRY_METRICS_OTLP_ENDPOINT
              value: "{{ .Values.config.telemetry.metrics.otlpEndpoint }}"
            {{- end }}
            - name: SANDBOX_TELEMETRY_LOG_OTLP_ENABLED
              value: "{{ .Values.config.telemetry.log.otlpEnabled }}"
            {{- if .Values.config.telemetry.log.otlpEndpoint }}
            - name: SANDBOX_TELEMETRY_LOG_OTLP_ENDPOINT
              value: "{{ .Values.config.telemetry.log.otlpEndpoint }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- if eq .Values.config.workspace.mode "fuse" }}
          volumeMounts:
            - name: workspace-credentials
              mountPath: /run/secrets/workspace
              readOnly: true
            {{- if eq .Values.config.runtime.type "docker" }}
            - name: workspace-secret-staging
              mountPath: /var/lib/sandbox/workspace-secrets
            {{- end }}
          {{- end }}
      {{- if eq .Values.config.workspace.mode "fuse" }}
      volumes:
        - name: workspace-credentials
          secret:
            secretName: {{ required "workspaceCredentials.apiSecretName is required in FUSE mode" .Values.workspaceCredentials.apiSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.workspaceCredentials.accessKeyKey }}
                path: accessKey
              - key: {{ .Values.workspaceCredentials.secretKeyKey }}
                path: secretKey
              {{- $selected := index .Values.config.workspace.providers .Values.config.storage.filesystem.provider }}
              {{- if ne ($selected.caSecretKey | default "") "" }}
              - key: {{ .Values.workspaceCredentials.caKey }}
                path: ca.crt
              {{- end }}
        {{- if eq .Values.config.runtime.type "docker" }}
        - name: workspace-secret-staging
          hostPath:
            path: {{ required "workspaceCredentials.dockerStagingHostPath is required for Docker FUSE" .Values.workspaceCredentials.dockerStagingHostPath }}
            type: Directory
        {{- end }}
      {{- end }}
