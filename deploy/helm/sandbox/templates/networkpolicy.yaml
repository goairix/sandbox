{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox
    release: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: sandbox
      release: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - {}
---
{{- $sandboxNs := .Values.config.runtime.kubernetes.namespace | default .Release.Namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-runtime-default-deny
  namespace: {{ $sandboxNs }}
  labels:
    app: sandbox-runtime
    release: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      sandbox.managed: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
{{- end }}
