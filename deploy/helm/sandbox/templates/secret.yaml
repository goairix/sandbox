{{- $builtinSentinel := eq (include "sandbox.builtinSentinel" .) "true" }}
{{- $sentinelConfig := dict }}
{{- if $builtinSentinel }}
{{- include "sandbox.validateRedis" . }}
{{- $sentinelConfig = include "sandbox.sentinelConfig" . | fromJson }}
{{- end }}
{{- if and .Values.config.security.apiKey (not .Values.config.security.apiKeySecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox
    release: {{ .Release.Name }}
type: Opaque
data:
  api-key: {{ .Values.config.security.apiKey | b64enc | quote }}
{{- end }}
{{- if and .Values.redis.enabled .Values.redis.password (or (not $builtinSentinel) (empty $sentinelConfig.existingSecret)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox-redis
    release: {{ .Release.Name }}
type: Opaque
data:
  {{- if eq .Values.redis.mode "sentinel" }}
  {{ $sentinelConfig.dataPasswordKey | quote }}: {{ .Values.redis.password | b64enc | quote }}
  {{ $sentinelConfig.sentinelPasswordKey | quote }}: {{ $sentinelConfig.password | b64enc | quote }}
  {{- else }}
  password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
{{- else if and (not .Values.redis.enabled) (or .Values.redis.external.password .Values.redis.external.sentinelPassword) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox-redis
    release: {{ .Release.Name }}
type: Opaque
data:
  {{- if .Values.redis.external.password }}
  password: {{ .Values.redis.external.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.external.sentinelPassword }}
  sentinel-password: {{ .Values.redis.external.sentinelPassword | b64enc | quote }}
  {{- end }}
{{- end }}
