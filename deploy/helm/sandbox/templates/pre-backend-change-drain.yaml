{{- $installed := (lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-backend-fingerprint" .Release.Name)) | default dict -}}
{{- $installedFingerprint := dig "metadata" "annotations" "sandbox.huaxisy.com/backend-fingerprint" "" $installed -}}
{{- $desiredFingerprint := include "sandbox.backend.fingerprint" . -}}
{{- $installedDeployment := (lookup "apps/v1" "Deployment" .Release.Namespace (printf "%s-api" .Release.Name)) | default dict -}}
{{- $installedContainers := dig "spec" "template" "spec" "containers" (list) $installedDeployment -}}
{{- $installedVolumes := dig "spec" "template" "spec" "volumes" (list) $installedDeployment -}}
{{- $installedContainer := dict -}}
{{- if gt (len $installedContainers) 0 -}}
{{- $installedContainer = index $installedContainers 0 -}}
{{- end -}}
{{- if ne $installedFingerprint $desiredFingerprint }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-backend-change-drain
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox-drain
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    sandbox.huaxisy.com/backend-fingerprint: {{ $desiredFingerprint | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.preDeleteDrain.timeoutSeconds }}
  template:
    metadata:
      labels:
        app: sandbox-drain
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      restartPolicy: Never
      containers:
        - name: drain
          image: {{ include "sandbox.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--drain-kubernetes-deployment=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-hpa=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--drain-timeout=%ds" (int .Values.preDeleteDrain.timeoutSeconds) | quote }}
            - "--drain-release"
          env:
          {{- if hasKey $installedContainer "env" }}
{{ toYaml (get $installedContainer "env") | nindent 12 }}
          {{- else }}
{{ include "sandbox.drainEnv" . | nindent 12 }}
          {{- end }}
          {{- if hasKey $installedContainer "volumeMounts" }}
          volumeMounts:
{{ toYaml (get $installedContainer "volumeMounts") | nindent 12 }}
          {{- else if ne (.Values.config.storage.filesystem.caSecretKey | default "") "" }}
          volumeMounts:
            - {name: workspace-ca, mountPath: /run/secrets/workspace, readOnly: true}
          {{- end }}
      {{- if gt (len $installedVolumes) 0 }}
      volumes:
{{ toYaml $installedVolumes | nindent 8 }}
      {{- else if ne (.Values.config.storage.filesystem.caSecretKey | default "") "" }}
      volumes:
        - name: workspace-ca
          secret:
            secretName: {{ required "workspaceCA.secretName is required when a custom CA is configured" .Values.workspaceCA.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.config.storage.filesystem.caSecretKey }}
                path: ca.crt
      {{- end }}
{{- end }}
