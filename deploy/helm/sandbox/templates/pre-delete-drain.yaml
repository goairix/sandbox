{{- if .Values.preDeleteDrain.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-api-drain
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox-drain
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.preDeleteDrain.timeoutSeconds }}
  template:
    metadata:
      labels:
        app: sandbox-drain
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      restartPolicy: Never
      containers:
        - name: drain
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--drain-kubernetes-deployment=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-hpa=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--drain-timeout=%ds" (int .Values.preDeleteDrain.timeoutSeconds) | quote }}
            - "--drain-release"
          env:
{{ include "sandbox.drainEnv" . | nindent 12 }}
          {{- if ne (.Values.config.storage.filesystem.caSecretKey | default "") "" }}
          volumeMounts:
            - name: workspace-ca
              mountPath: /run/secrets/workspace
              readOnly: true
          {{- end }}
      {{- if ne (.Values.config.storage.filesystem.caSecretKey | default "") "" }}
      volumes:
        - name: workspace-ca
          secret:
            secretName: {{ required "workspaceCA.secretName is required when a custom CA is configured" .Values.workspaceCA.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.config.storage.filesystem.caSecretKey }}
                path: ca.crt
      {{- end }}
{{- end }}
