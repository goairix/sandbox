{{- if .Values.preDeleteDrain.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-api-drain
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox-drain
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.preDeleteDrain.timeoutSeconds }}
  template:
    metadata:
      labels:
        app: sandbox-drain
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      restartPolicy: Never
      containers:
        - name: drain
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--drain-kubernetes-deployment=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-hpa=%s-api" .Release.Name | quote }}
            - {{ printf "--drain-kubernetes-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--drain-timeout=%ds" (int .Values.preDeleteDrain.timeoutSeconds) | quote }}
            - "--drain-release"
          env:
            - name: SANDBOX_STATE_SCOPE
              value: {{ printf "%s/%s" (.Values.config.runtime.kubernetes.namespace | default .Release.Namespace) .Release.Name | quote }}
{{ include "sandbox.drainEnv" . | nindent 12 }}
          {{- if eq (include "sandbox.stateBackend" .) "etcd" }}
          volumeMounts:
            - name: etcd-config
              mountPath: /etc/sandbox/config.yaml
              subPath: config.yaml
              readOnly: true
          {{- if .Values.config.storage.state.etcd.existingSecret }}
            - name: etcd-client-tls
              mountPath: /etc/sandbox-etcd
              readOnly: true
          {{- end }}
          {{- end }}
      {{- if eq (include "sandbox.stateBackend" .) "etcd" }}
      volumes:
        - name: etcd-config
          configMap:
            name: {{ .Release.Name }}-etcd-config
        {{- if .Values.config.storage.state.etcd.existingSecret }}
        - name: etcd-client-tls
          secret:
            secretName: {{ .Values.config.storage.state.etcd.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
        {{- end }}
      {{- end }}
{{- end }}
