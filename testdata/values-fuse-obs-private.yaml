image:
  repository: registry.i.huaxisy.com/library/ai-infra/sandbox-api
  tag: v0.2.12
  pullPolicy: Always

replicaCount: 1

autoscaling:
  enabled: false

redis:
  enabled: true
  image:
    repository: registry.i.huaxisy.com/library/redis
    tag: 7.4.2
    pullPolicy: IfNotPresent
  persistence:
    enabled: false

workspaceCredentials:
  apiSecretName: sandbox-workspace-obs-private

config:
  runtime:
    type: kubernetes
    kubernetes:
      namespace: sandbox-fuse
  pool:
    minSize: 0
    maxSize: 1
  images:
    sandbox: registry.i.huaxisy.com/library/ai-infra/sandbox-runtime:v0.2.12
    gateway: registry.i.huaxisy.com/library/ai-infra/sandbox-gateway:v0.2.12
  storage:
    filesystem:
      preset: huawei-obs-private
      bucket: sandbox-fuse-workspace
      region: cn-southwest-268
      endpoint: https://obs.cn-southwest-268.shuanghuayun.com
      storageIdentity: formal-obs-private-2023-primary
      credentialGeneration: formal-obs-private-20260906-v1
      caSecretKey: ""
      endpointHostIPs: []
      systemEgressMode: cilium-fqdn
      dnsCIDRs:
        - 223.5.5.5/32
        - 114.114.114.114/32
      systemEgressCIDRs: []
      endpointPorts:
        - 443
      subPath: ""
      useSSL: true
  workspace:
    defaultMountMode: sync
    enabledMountModes: [sync, fuse]
    secretName: sandbox-workspace-obs-private
    allowMissingLSMForKind: false
    cacheSize: 512Mi
    flushTimeoutSeconds: 60
    unmountTimeoutSeconds: 30
    fusePool:
      minSize: 1
      maxSize: 2
      refillIntervalSeconds: 5
      prepareTimeoutSeconds: 180
    fuseImages:
      mounter: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-mounter:v0.2.12
      docker: registry.i.huaxisy.com/library/ai-infra/sandbox-fuse-docker:v0.2.12
    lsmProfile: sandbox-fuse
    proxyURL: ""
  security:
    apiKeySecretName: sandbox-fuse-api-key
    seccompProfile: RuntimeDefault
    networkEnabled: true
    networkBlockPrivate: true
