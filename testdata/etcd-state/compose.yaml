x-member: &member
  image: gcr.io/etcd-development/etcd:v3.6.15@sha256:5ed4e32061aa061f970d6500629213e8579ef17571dcf9789074966acb9afad1
  entrypoint: /usr/local/bin/etcd
  healthcheck:
    test: [CMD, /usr/local/bin/etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
    interval: 1s
    timeout: 3s
    retries: 60
  ports:
    - target: 2379
      host_ip: 127.0.0.1
  environment:
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: sandbox-state-integration
    ETCD_DATA_DIR: /etcd-data
    ETCD_LOG_LEVEL: warn

services:
  etcd-1:
    <<: *member
    environment:
      ETCD_NAME: etcd-1
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sandbox-state-integration
      ETCD_DATA_DIR: /etcd-data
      ETCD_LOG_LEVEL: warn
    volumes: [etcd-1-data:/etcd-data]
  etcd-2:
    <<: *member
    environment:
      ETCD_NAME: etcd-2
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sandbox-state-integration
      ETCD_DATA_DIR: /etcd-data
      ETCD_LOG_LEVEL: warn
    volumes: [etcd-2-data:/etcd-data]
  etcd-3:
    <<: *member
    environment:
      ETCD_NAME: etcd-3
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sandbox-state-integration
      ETCD_DATA_DIR: /etcd-data
      ETCD_LOG_LEVEL: warn
    volumes: [etcd-3-data:/etcd-data]
  foreign:
    <<: *member
    environment:
      ETCD_NAME: foreign
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://foreign:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://foreign:2380
      ETCD_INITIAL_CLUSTER: foreign=http://foreign:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sandbox-state-foreign-identity-test
      ETCD_DATA_DIR: /etcd-data
      ETCD_LOG_LEVEL: warn
    volumes: [foreign-data:/etcd-data]

volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  foreign-data:
